<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h1>Customer Churn Prediction</h1>

    <form action="/predict" method="POST">

        <input type="number" name="tenure" placeholder="Tenure (Months)" required>

        <input type="number" step="0.01" name="MonthlyCharges" placeholder="Monthly Charges" required>

        <input type="number" step="0.01" name="TotalCharges" placeholder="Total Charges" required>

        <select name="Contract" required>
            <option value="">Select Contract</option>
            <option>Month-to-month</option>
            <option>One year</option>
            <option>Two year</option>
        </select>

        <select name="PaymentMethod" required>
            <option value="">Payment Method</option>
            <option>Electronic check</option>
            <option>Mailed check</option>
            <option>Bank transfer (automatic)</option>
            <option>Credit card (automatic)</option>
        </select>

        <select name="InternetService" required>
            <option value="">Internet Service</option>
            <option>DSL</option>
            <option>Fiber optic</option>
            <option>No</option>
        </select>

        <select name="OnlineSecurity" required>
            <option value="">Online Security</option>
            <option>Yes</option>
            <option>No</option>
            <option>No internet service</option>
        </select>

        <select name="TechSupport" required>
            <option value="">Tech Support</option>
            <option>Yes</option>
            <option>No</option>
            <option>No internet service</option>
        </select>

        <button type="submit">Predict</button>

    </form>

    <h2>{{ prediction_text }}</h2>

</div>

</body>
</html>
